project_id = "sgtudy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

# D10: private 버킷, 10MB, MIME 화이트리스트. 호스팅에는 0003_rls.sql 이 같은 설정으로 INSERT 한다.
[storage.buckets.attachments]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/gif", "image/webp", "application/pdf", "application/zip", "application/x-zip-compressed", "text/plain", "text/markdown"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**", "https://sgtudy.vercel.app/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
# 비밀번호 정책 — src/components/auth/password.ts 와 같은 값. 호스팅 반영: scripts/apply-hosted-auth.sh
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

# CAPTCHA(Cloudflare Turnstile) — 로컬은 꺼 둔다: 켜면 토큰 없는 로그인(시드·스크립트·다른 작업)이 400 captcha_failed 로 막힌다.
# config.toml 은 supabase start 때만 읽으니 바꾸면 stop/start 가 필요하다. 로컬에서 시험할 때만 아래 주석을 풀고
# .env.local 에 NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA (항상 통과 테스트 키) — 실패 시험은 시크릿 2x0000000000000000000000000000000AA.
# 호스팅은 scripts/apply-hosted-auth.sh 가 TURNSTILE_SECRET_KEY 로 켠다(README "CAPTCHA 켜기").
# [auth.captcha]
# enabled = true
# provider = "turnstile"
# secret = "1x0000000000000000000000000000000AA"

# 디자인 §4.1 / 03-api §1: 6자리 OTP, 만료 600초, 재전송 60초. 호스팅 대시보드(Auth → Providers → Email)에도 같은 값을 넣는다.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# 비밀번호 변경(/me)은 재인증 코드(nonce) 필수 — GoTrue 는 24시간 안에 만든 세션(방금 코드 확인한 가입·재설정 포함)은 예외로 둔다.
# 호스팅: scripts/apply-hosted-auth.sh security_update_password_require_reauthentication
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

# 메일 템플릿 — 로컬(Mailpit)과 호스팅이 같은 파일을 쓴다. 호스팅 반영: scripts/apply-hosted-auth.sh
[auth.email.template.magic_link]
subject = "[슥터디] 인증 코드"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "[슥터디] 가입 인증 코드"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.reauthentication]
subject = "[슥터디] 본인 확인 코드"
content_path = "./supabase/templates/reauthentication.html"

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = false

# 0019 의 pg_cron → pg_net 이 x-cleanup-secret 헤더(env CLEANUP_FILES_SECRET)로 부른다 — JWT 대신 함수가 직접 검사
[functions.cleanup-files]
verify_jwt = false

[analytics]
enabled = false
